[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "earnings-call-dashboard"
version = "0.1.0"
description = "法說會分析儀表板 — FastAPI dashboard for NLP analysis of earnings-call transcripts (Q&A summary, risk labels, transparency score, radar chart, investment insights, and Gemini-powered chat)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "自然語言處理 期末專案" }]
keywords = ["fastapi", "nlp", "earnings-call", "gemini", "azure-language", "traditional-chinese"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Web stack
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    # Pydantic / config
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    # Document parsing
    "python-docx>=1.1",
    # API clients — both Gemini SDKs are needed:
    #   google-generativeai (old) is used by chat_service / insights / Q&A fallback
    #   google-genai        (new) is used by adapters/mengcheng_adapter (preprocessing)
    "google-generativeai>=0.7",
    "google-genai>=0.3",
    "azure-ai-textanalytics>=5.3",
    "azure-core>=1.30",
    "openai>=1.30",
    "requests>=2.31",
    # Upstream team modules (浩誠 radar_chart needs matplotlib+numpy+jieba)
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "jieba>=0.42.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "httpx>=0.26",
]

[project.scripts]
earnings-call-dashboard = "cli:main"

[project.urls]
Homepage = "https://github.com/Andrew-KKK/NLP-Earnings-Call-Processing"
Documentation = "https://github.com/Andrew-KKK/NLP-Earnings-Call-Processing/blob/main/README.md"

[tool.setuptools]
# Flat-layout: top-level py files and three first-party packages.
py-modules = ["app", "config", "cli"]

[tool.setuptools.packages.find]
where = ["."]
include = ["routes*", "services*", "adapters*"]
exclude = ["tests*", "docs*", "data*"]

[tool.setuptools.package-data]
# Templates + static assets ship inside the package via the editable install
# pointing at the source tree. For a wheel build, MANIFEST.in would also list these.
"*" = ["templates/**/*.html", "static/**/*.js", "static/**/*.css"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = [
    "ignore::DeprecationWarning",
]
